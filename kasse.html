<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Kasse</title>
<link rel="stylesheet" href="kasse.css">
</head>
<body>
<header class="top">
  <a href="index.html">⌂ Startseite</a>
  <strong>Kasse</strong>
  <span></span>
</header>

<main>
  <h1>Kasse</h1>

  <section class="layout">
    <section class="kasse-box">
      <h2>Artikel</h2>

      <label for="sellerNumber">Verkäufernummer</label>
      <input id="sellerNumber" type="tel" inputmode="numeric" autocomplete="off" placeholder="z. B. 511">
      <div id="sellerStatus" class="seller-status">Bitte Verkäufernummer eingeben.</div>

      <div class="row">
        <div class="field">
          <label for="size">Größe</label>
          <input id="size" type="tel" inputmode="numeric" pattern="[0-9]*" autocomplete="off" placeholder="z. B. 104">
        </div>

        <button id="toyButton" class="toy-button" type="button" aria-pressed="false" type="button">
          🧸<br><span>Spielzeug</span>
        </button>
      </div>

      <label for="price">Preis</label>
      <div class="price-wrap">
        <input id="price" type="text" inputmode="decimal" autocomplete="off" placeholder="0,00">
        <span>€</span>
      </div>

      <button id="addButton" class="continue" type="button" disabled type="button">Weiterer Artikel</button>
      <button id="finishButton" class="finish" type="button" disabled type="button">Fertig</button>
<button id="cancelEditButton" class="cancel-edit hidden" type="button">Bearbeiten abbrechen</button>
    </section>

    <aside id="receiptLive" class="receipt-live hidden-receipt">
      <div class="receipt-head">
        <strong>Kassenbon</strong>
        <span id="itemCount">0 Artikel</span>
      </div>
      <div id="receiptItems" class="receipt-items">
        <div class="receipt-empty">Noch keine Artikel.</div>
      </div>
      <div class="receipt-total">
        <span>Gesamt</span>
        <strong id="liveTotal">0,00 €</strong>
      </div>
    </aside>
  </section>

<section class="receipt-live">
  <div class="receipt-head"><strong>Kassenbon</strong><span id="itemCount">0 Artikel</span></div>
  <div id="receiptItems" class="receipt-items"><div class="receipt-empty">Noch keine Artikel.</div></div>
  <div class="receipt-total"><span>Gesamt</span><strong id="liveTotal">0,00 €</strong></div>
</section>
</main>

<div id="paymentModal" class="modal">
  <div class="payment-box">
    <div class="modal-head">
      <div>
        <h2>Kassenbon</h2>
        <div id="finalCount" class="final-count"></div>
      </div>
      <button id="closePayment" class="close" type="button">×</button>
    </div>

    <div id="finalReceipt" class="final-receipt"></div>

    <div class="payment-total">
      <span>Gesamt</span>
      <strong id="finalTotal">0,00 €</strong>
    </div>

    <div class="payment-buttons">
      <button class="payment cash" data-payment="Bar" type="button">Bar</button>
      <button class="payment card" data-payment="EC" type="button">EC</button>
      <button class="payment paypal" data-payment="PayPal" type="button">PayPal</button>
    </div>
  </div>
</div>

<div id="successModal" class="modal">
  <div class="success-box">
    <div class="success-icon">✓</div>
    <h2>Verkauf gespeichert</h2>
    <p id="successText"></p>
    <button id="newSaleButton" class="continue" type="button">Neuer Verkauf</button>
  </div>
</div>

<script src="kasse.js"></script>
</body>
</html>
