<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#172033">
<title>Kleiderbörse – Buchhaltung</title>
<link rel="stylesheet" href="home.css?v=62">
</head>
<body>
<main class="home">
  <div style="display:flex;justify-content:flex-end;margin-bottom:8px"><button id="kbLogout" type="button" style="border:0;border-radius:12px;background:#edf0f5;color:#172033;padding:10px 14px;font:700 14px inherit;cursor:pointer">Abmelden</button></div>
  <header>
    <img class="home-logo" src="kleiderboerse-logo.jpg?v=59" alt="Kleiderbörse Ostereistedt">
  </header>



  <div class="menu">
    <a class="menu-button blue" id="openRegisterModal" href="#registerModal" aria-haspopup="dialog">
      <span class="icon">🧾</span>
      <span class="menu-copy"><strong>Kasse</strong><small>Verkäufe erfassen</small></span>
      <span class="arrow">›</span>
    </a>

    <a class="menu-button orange" href="tagesabschluss.html">
      <span class="icon">📊</span>
      <span class="menu-copy"><strong>Tagesabschluss</strong><small>Umsatz & Zahlungsarten</small></span>
      <span class="arrow">›</span>
    </a>

    <a class="menu-button green" href="verkaeufer.html">
      <span class="icon">👤</span>
      <span class="menu-copy"><strong>Verkäufer</strong><small>Verkäufer verwalten</small></span>
      <span class="arrow">›</span>
    </a>

    <a class="menu-button purple" href="archiv.html">
      <span class="icon">🗂️</span>
      <span class="menu-copy"><strong>Archiv</strong><small>Vergangene Börsen</small></span>
      <span class="arrow">›</span>
    </a>
  </div>

  <section id="homeCloudPanel" style="margin:14px 0 20px;padding:16px;border:1px solid #d9e1ec;border-radius:18px;background:#fff">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap">
      <div>
        <strong style="display:block;font-size:18px">☁ Cloud-Verbindung</strong>
        <span id="homeCloudStatus" style="font-size:14px;color:#667085">Verbindung wird geprüft …</span>
      </div>
      <button id="homeCloudLogin" type="button" style="border:0;border-radius:12px;background:#2459c5;color:#fff;padding:13px 18px;font-weight:800;font-size:15px">Cloud anmelden</button>
    </div>
  </section>
</main>

<div id="registerModal" class="register-modal" aria-hidden="true">
  <div class="register-modal-box" role="dialog" aria-modal="true" aria-labelledby="registerModalTitle">
    <h2 id="registerModalTitle">Welche Kasse?</h2>
    <p>Bitte die Kasse auswählen.</p>
    <div class="register-choice-grid">
      <a href="kasse.html?kasse=1&from=accounting">Kasse 1</a><a href="kasse.html?kasse=2&from=accounting">Kasse 2</a>
      <a href="kasse.html?kasse=3&from=accounting">Kasse 3</a><a href="kasse.html?kasse=4&from=accounting">Kasse 4</a>
      <a href="kasse.html?kasse=5&from=accounting">Kasse 5</a><a href="kasse.html?kasse=6&from=accounting">Kasse 6</a>
    </div>
    <button type="button" class="register-cancel" id="closeRegisterModal">Abbrechen</button>
  </div>
</div>
<script src="auth.js"></script>
<script src="cloud-config.js"></script>
<script src="cloud.js?v=86"></script>
<script>
(function(){
  if(!KBAuth.requireRole(["accounting"])) return;
  document.getElementById("kbLogout").onclick=function(){KBAuth.logout()};
  var cloudStatus=document.getElementById("homeCloudStatus");
  var cloudButton=document.getElementById("homeCloudLogin");
  var cloudCheckRunning=false;
  async function refreshCloudPanel(){
    if(cloudCheckRunning) return;
    cloudCheckRunning=true;
    var signed=window.KBCloud && KBCloud.isSignedIn();
    cloudStatus.textContent=signed?"Cloud-Verbindung wird geprüft …":"Nicht angemeldet – bitte anmelden.";
    cloudStatus.style.color="#b45309";
    cloudButton.textContent=signed?"Cloud-Konto wechseln / abmelden":"Cloud anmelden";
    try{
      if(signed && KBCloud.verifyConnection){
        await KBCloud.verifyConnection();
        cloudStatus.textContent="Verbunden – Cloud-Daten sind erreichbar.";
        cloudStatus.style.color="#16804c";
      }else{
        cloudStatus.textContent="Nicht angemeldet – bitte anmelden.";
      }
    }catch(error){
      cloudStatus.textContent="Keine Cloud-Datenverbindung: "+(error.message||"Bitte anmelden.");
      cloudStatus.style.color="#b42318";
    }finally{cloudCheckRunning=false;}
  }
  cloudButton.onclick=function(){
    if(window.KBCloud){
      if(KBCloud.isSignedIn()){
        if(confirm("Möchtest du die Cloud-Verbindung abmelden?")) KBCloud.signOut();
      }else KBCloud.showLogin();
    }
    setTimeout(refreshCloudPanel,250);
  };
  refreshCloudPanel();
  window.addEventListener("focus",refreshCloudPanel);
  var modal=document.getElementById("registerModal"), close=document.getElementById("closeRegisterModal");
  close.onclick=function(){window.location.hash=""};
})();
</script>
</body>
</html>
