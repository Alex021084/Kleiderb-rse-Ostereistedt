<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#172033">
<title>Kleiderbörse</title>
<link rel="stylesheet" href="home.css">
</head>
<body>
<main class="home">
  <header>
    <div class="logo">KB</div>
    <h1>Kleiderbörse</h1>
  </header>

  <div class="menu">
    <button class="menu-button blue" id="openRegisterModal" type="button" aria-haspopup="dialog">
      <span class="icon">🧾</span>
      <span class="menu-copy"><strong>Kasse</strong><small>Verkäufe erfassen</small></span>
    </button>

    <a class="menu-button green" href="verkaeufer.html">
      <span class="icon">👤</span>
      <span class="menu-copy"><strong>Verkäufer</strong><small>Verkäufer verwalten</small></span>
    </a>

    <a class="menu-button orange" href="tagesabschluss.html">
      <span class="icon">📊</span>
      <span class="menu-copy"><strong>Tagesabschluss</strong><small>Umsatz & Zahlungsarten</small></span>
    </a>
  </div>
</main>

<div id="registerModal" class="register-modal" aria-hidden="true">
  <div class="register-modal-box" role="dialog" aria-modal="true" aria-labelledby="registerModalTitle">
    <h2 id="registerModalTitle">Welche Kasse?</h2>
    <p>Bitte die Kasse auswählen.</p>
    <div class="register-choice-grid">
      <button type="button" data-register="Kasse 1">Kasse 1</button>
      <button type="button" data-register="Kasse 2">Kasse 2</button>
      <button type="button" data-register="Kasse 3">Kasse 3</button>
      <button type="button" data-register="Kasse 4">Kasse 4</button>
      <button type="button" data-register="Kasse 5">Kasse 5</button>
    </div>
    <button type="button" class="register-cancel" id="closeRegisterModal">Abbrechen</button>
  </div>
</div>

<script>
(function(){
  var modal=document.getElementById("registerModal");
  var open=document.getElementById("openRegisterModal");
  var close=document.getElementById("closeRegisterModal");

  function showModal(){
    modal.classList.add("open");
    modal.setAttribute("aria-hidden","false");
  }
  function hideModal(){
    modal.classList.remove("open");
    modal.setAttribute("aria-hidden","true");
  }

  open.onclick=showModal;
  close.onclick=hideModal;

  var choices=document.querySelectorAll("[data-register]");
  for(var i=0;i<choices.length;i++){
    choices[i].onclick=function(){
      var reg=this.getAttribute("data-register");
      try{ localStorage.setItem("kb_register",reg); }catch(e){}
      window.location.href="kasse.html";
    };
  }

  modal.onclick=function(e){
    if(e.target===modal) hideModal();
  };
})();
</script>
</body>
</html>
