<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><title>Verkäufer</title><link rel="stylesheet" href="seller.css?v=29">
<style>
.seller-extra-fields{margin-top:16px;padding-top:14px;border-top:1px solid #e5e7eb}
.seller-extra-fields .field-note{display:block;font-size:13px;color:#7b8490;margin:-5px 0 10px}
.payout-box{margin-top:14px;padding:12px 14px;border:1px solid #e1e5eb;border-radius:12px;background:#f8fafc}
.payout-box label{margin-top:0}
.payout-box select{width:100%;box-sizing:border-box;height:48px;border:1px solid #cfd5dd;border-radius:10px;background:#fff;padding:0 12px;font-size:17px}

/* v2: Modal-Inhalt auf iPhone/iPad selbst scrollen */
html.modal-open, body.modal-open{overflow:hidden!important;height:100%!important;}
body.modal-open{overscroll-behavior:none!important;}
.modal{touch-action:pan-y!important;overscroll-behavior:contain!important;}
.modal > .box{max-height:calc(100dvh - 24px)!important;overflow-y:auto!important;overflow-x:hidden!important;-webkit-overflow-scrolling:touch!important;overscroll-behavior:contain!important;touch-action:pan-y!important;}
@supports not (height: 100dvh){.modal > .box{max-height:calc(100vh - 24px)!important;}}
</style>
</head>
<body>
<header class="top"><a class="home-link" href="index.html">⌂ Startseite</a><strong>Verkäufer</strong></header>
<main>
<h1>Verkäufer</h1>
<button class="add" onclick="openForm()">＋ Verkäufer hinzufügen</button>
<div class="search"><span>⌕</span><input id="search" type="search" placeholder="Verkäufer suchen"></div>
<p id="count" class="count"></p><section id="list"></section>
</main>

<div id="modal" class="modal hidden"><div class="box">
  <div class="modalhead"><h2 id="modalTitle">Verkäufer hinzufügen</h2><button onclick="closeForm()">×</button></div>
  <label>Verkäufernummer *</label><input id="number" type="tel" inputmode="numeric" placeholder="z. B. 1234">
  <label>Name *</label><input id="name" type="text" placeholder="Vorname Nachname">
  <label>Telefonnummer <span>(optional)</span></label><input id="phone" type="tel" inputmode="tel" placeholder="z. B. 0170 1234567">

  <div class="seller-extra-fields">
    <label>Adresse <span>(optional)</span></label>
    <input id="address" type="text" autocomplete="street-address" placeholder="Straße, Hausnummer, PLZ Ort">
    <label>E-Mail-Adresse <span>(optional)</span></label>
    <input id="email" type="email" autocomplete="email" placeholder="z. B. name@beispiel.de">
    <div class="payout-box">
      <label for="payoutMethod">Auszahlungsart</label>
      <span class="field-note">Wie soll der Verkäufer sein Geld erhalten?</span>
      <select id="payoutMethod">
        <option value="Bar">Bar</option>
        <option value="Überweisung">Überweisung</option>
        <option value="PayPal">PayPal</option>
      </select>
    </div>
  </div>

  <div class="commission-settings">
    <label class="commission-check"><input id="commissionEnabled" type="checkbox" checked><span>Provision berechnen</span></label>
    <div id="commissionRateWrap" class="commission-rate-wrap">
      <label for="commissionRate">Provisionssatz</label>
      <div class="percent-input"><input id="commissionRate" type="number" inputmode="decimal" min="0" max="100" step="0.5" value="15"><span>%</span></div>
    </div>
  </div>
  <div id="error"></div><div class="actions"><button onclick="closeForm()">Abbrechen</button><button class="save" onclick="saveSeller()">Speichern</button></div>
</div></div>

<div id="report" class="modal hidden"><div class="box reportbox">
  <div class="modalhead"><div><h2 id="reportTitle">Abrechnung</h2><div id="reportSeller" class="reportSeller"></div></div><button onclick="closeReport()">×</button></div>
  <div class="reportgrid">
    <div class="reportitem"><span>Verkaufte Teile</span><strong id="reportPieces">0</strong></div>
    <div class="reportitem"><span>Gesamtumsatz</span><strong id="reportTurnover">0,00 €</strong></div>
    <div class="reportitem payout"><span>Auszahlung nach Provision</span><strong id="reportPayout">0,00 €</strong></div>
  </div>
  <p class="reportnote">Die Abrechnung wird aus den erfassten Verkäufen dieser Verkäufernummer berechnet.</p>
</div></div>

<script src="cloud-config.js"></script><script src="cloud.js"></script><script src="seller.js"></script>
</body></html>
