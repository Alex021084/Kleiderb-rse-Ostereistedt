<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#172033">
  <title>Kleiderbörse</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="home">
    <header>
      <div class="logo">KB</div>
      <div>
        <h1>Kleiderbörse</h1>
        <p>Kassenverwaltung</p>
      </div>
    </header>

    <section class="menu">
      <button class="menu-button cashier" onclick="alert('Kasse wird geöffnet')">
        <span class="icon">🧾</span>
        <span class="label">Kasse</span>
        <span class="sub">Verkäufe erfassen</span>
      </button>

      <button class="menu-button sellers" onclick="alert('Verkäufer wird geöffnet')">
        <span class="icon">👤</span>
        <span class="label">Verkäufer</span>
        <span class="sub">Verkäufer verwalten</span>
      </button>

      <button class="menu-button closing" onclick="alert('Tagesabschluss wird geöffnet')">
        <span class="icon">📊</span>
        <span class="label">Tagesabschluss</span>
        <span class="sub">Umsatz & Zahlungsarten</span>
      </button>
    </section>

    <footer>Kleiderbörse · Kassen-App</footer>
  </main>
</body>
</html>
